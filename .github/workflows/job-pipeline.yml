name: Automated Job Processing Pipeline

on:
  schedule:
    # First daily execution at 09:00 UTC
    - cron: '0 9 * * *'
    # Second daily execution at 21:00 UTC
    - cron: '0 21 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-job-pipeline:
    name: Trigger Job Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Log Execution Details
        run: |
          echo "=========================================="
          echo "Triggering AI Career Platform Job Pipeline"
          echo "Trigger Event: ${{ github.event_name }}"
          echo "Execution Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="

      - name: Validate Configuration Secrets
        env:
          PIPELINE_API_URL: ${{ secrets.PIPELINE_API_URL }}
          PIPELINE_API_SECRET: ${{ secrets.PIPELINE_API_SECRET }}
        run: |
          if [ -z "$PIPELINE_API_URL" ]; then
            echo "::error::Secret PIPELINE_API_URL is missing. Please configure it in repository secrets."
            exit 1
          fi

          if [ -z "$PIPELINE_API_SECRET" ]; then
            echo "::error::Secret PIPELINE_API_SECRET is missing. Please configure it in repository secrets."
            exit 1
          fi

          echo "Secrets validation succeeded."

      - name: Trigger Backend Pipeline
        env:
          PIPELINE_API_URL: ${{ secrets.PIPELINE_API_URL }}
          PIPELINE_API_SECRET: ${{ secrets.PIPELINE_API_SECRET }}
        run: |
          BASE_URL="${PIPELINE_API_URL%/}"

          if [[ "$BASE_URL" == */run ]]; then
            ENDPOINT="$BASE_URL"
          else
            ENDPOINT="$BASE_URL/jobs/pipeline/run"
          fi
          echo "Sending POST request to: $ENDPOINT"

          MAX_ATTEMPTS=3

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Request attempt $ATTEMPT/$MAX_ATTEMPTS"

            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "$ENDPOINT" \
              -H "Content-Type: application/json" \
              -H "x-api-key: $PIPELINE_API_SECRET" \
              --data '{}' \
              --max-time 600)

            HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

            echo "Response HTTP Status: $HTTP_STATUS"
            echo "Response Body:"
            echo "$HTTP_BODY"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "=========================================="
              echo "Job pipeline executed successfully."
              echo "=========================================="
              exit 0
            fi

            if [ "$HTTP_STATUS" -ge 500 ] && [ "$HTTP_STATUS" -lt 600 ]; then
              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                echo "::warning::Received HTTP $HTTP_STATUS from pipeline API. Retrying in 10 seconds."
                sleep 10
                continue
              fi

              echo "::warning::Pipeline API is currently unavailable (HTTP $HTTP_STATUS). Skipping hard failure."
              exit 0
            fi

            echo "::error::Job pipeline execution failed with HTTP status $HTTP_STATUS."
            exit 1
          done
