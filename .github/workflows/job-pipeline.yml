name: Scheduled Job Pipeline

on:
  schedule:
    # Runs twice daily at 06:00 and 15:00 UTC (equivalent to 09:00 and 18:00 UTC+3 / Asia/Gaza)
    - cron: '0 6,15 * * *'
  workflow_dispatch:
    # Allows manual triggering from GitHub Actions tab anytime

jobs:
  run-pipeline:
    name: Run Job Collection & Telegram Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Job Pipeline
        env:
          NODE_ENV: production
          PORT: 3000
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOB_RUN_TIME_1: ${{ secrets.JOB_RUN_TIME_1 || '09:00' }}
          JOB_RUN_TIME_2: ${{ secrets.JOB_RUN_TIME_2 || '18:00' }}
          TIMEZONE: ${{ secrets.TIMEZONE || 'Asia/Gaza' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
        run: npm run pipeline:run