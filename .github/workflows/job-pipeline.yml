name: Daily Job Agent

on:
  # Scheduled cron disabled: the server (server.ts) now stays awake on Render
  # via the keep-alive workflow, so its built-in jobNotificationScheduler
  # already sends notifications at each user's preferred local times.
  # Keeping this cron too would cause duplicate notification runs.
  # Uncomment below only if you stop using the keep-alive workflow.
  # schedule:
  #   - cron: '0 7 * * *'
  #   - cron: '0 19 * * *'
  workflow_dispatch: {}

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run job pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npx tsx src/scripts/run-pipeline.ts