name: Scheduled Job Pipeline

on:
  schedule:
    # Safety net only. GitHub's scheduler can fire hours late, so we trigger hourly
    # (off the top of the hour) and the pipeline script catches up on any 09:00/21:00
    # Asia/Gaza slot that was not sent yet. The on-time trigger is an external
    # scheduler calling workflow_dispatch.
    - cron: '17 * * * *'
  workflow_dispatch:
    # Allows manual triggering from GitHub Actions tab anytime

jobs:
  run-pipeline:
    name: Run Job Collection & Telegram Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Job Pipeline
        env:
          NODE_ENV: production
          PORT: 3000
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          JOB_RUN_TIME_1: ${{ secrets.JOB_RUN_TIME_1 || '09:00' }}
          JOB_RUN_TIME_2: ${{ secrets.JOB_RUN_TIME_2 || '21:00' }}
          TIMEZONE: ${{ secrets.TIMEZONE || 'Asia/Gaza' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          MIN_MATCH_SCORE: ${{ secrets.MIN_MATCH_SCORE || '40' }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npm run pipeline:run