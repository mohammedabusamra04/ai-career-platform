name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping server
        run: |
          curl -fsS "${{ secrets.RENDER_APP_URL }}" -o /dev/null -w "Status: %{http_code}\n" || echo "Ping failed (server may be waking up)"